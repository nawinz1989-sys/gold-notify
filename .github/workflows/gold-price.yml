name: Gold Price LINE Notify

on:
  schedule:
    - cron: '0 5 * * *'   # 12:00 Bangkok (UTC+7)
    - cron: '0 17 * * *'  # 00:00 Bangkok (UTC+7)
  workflow_dispatch:       # รันมือได้

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send gold price to LINE
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 notify.py
