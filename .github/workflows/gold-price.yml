name: Gold Price LINE Notify

on:
  schedule:
    - cron: '10 21 * * *'  # 04:10 ICT
    - cron: '40 2 * * *'   # 09:40 ICT
    - cron: '40 5 * * *'   # 12:40 ICT
    - cron: '40 9 * * *'   # 16:40 ICT
    - cron: '40 13 * * *'  # 20:40 ICT
    - cron: '10 16 * * *'  # 23:10 ICT
  workflow_dispatch:       # รันมือได้
    inputs:
      profile:
        description: 'ทดสอบโปรไฟล์ (auto=ตามเวลา, A=หุ้นสหรัฐ, B=พื้นฐาน, C=หุ้นไทย)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'A', 'B', 'C']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send prices to LINE
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: python3 notify.py
