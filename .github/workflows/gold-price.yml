name: Gold Price LINE Notify

on:
  # ⛔ ปิด cron อัตโนมัติแล้ว — ย้ายตัวจับเวลาไป Cloudflare Worker (gold-notify-cf)
  # เพราะ GitHub cron ดีเลย์เป็นชั่วโมง เหลือไว้แค่ปุ่มกดมือเผื่อฉุกเฉิน
  workflow_dispatch:       # รันมือได้
    inputs:
      profile:
        description: 'ทดสอบโปรไฟล์ (auto=ตามเวลา, A=หุ้นสหรัฐ, B=พื้นฐาน, C=หุ้นไทย)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'A', 'B', 'C']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send prices to LINE
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: python3 notify.py
